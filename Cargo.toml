[workspace]
members = [
    "crates/rift-core",
    "crates/rift-git",
    "crates/rift-parser",
    "crates/rift-analysis",
    "crates/rift-cli",
    "crates/rift-ui",
    "crates/rift-jev",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
criterion = "0.5"
rayon = "1.10"
quote = "1.0"
tempfile = "3"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
git2 = "0.19"
tree-sitter = "0.22"
thiserror = "1.0"
similar = "2.6"
walkdir = "2.5"
ignore = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }
syn = { version = "2.0", features = ["full", "parsing"] }
sha2 = "0.10"
