[package]
name = "rift-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
rift-core = { path = "../rift-core" }
rift-git = { path = "../rift-git" }
rift-parser = { path = "../rift-parser" }
rift-analysis = { path = "../rift-analysis" }
rift-jev = { path = "../rift-jev" }
rift-ui = { path = "../rift-ui" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
git2 = { workspace = true }
tempfile = { workspace = true }
